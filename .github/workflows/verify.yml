name: Verify multilingual release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify all required SHA-256 assets
        run: python -B run.py verify

      - name: Verify both documentation languages and optional checksums
        run: python -B run.py docs-audit

      - name: Verify contextual help registry
        run: python -B run.py help-audit

      - name: Run offline Python and Node regression tests
        run: python -B run.py test

      - name: Verify Git archive bytes (distribution test)
        run: python -B tools/verify_git_archive.py

      - name: Assert verification did not edit tracked files
        run: git diff --exit-code
